# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crimespot
      POSTGRES_USER: crimespot
      POSTGRES_PASSWORD: crimespot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
