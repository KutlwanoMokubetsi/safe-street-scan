# Render Blueprint: API (Docker) + Angular static site. Database: Neon or Render Postgres.
services:
  - type: web
    name: crimespot-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL        # jdbc:postgresql://<host>/<db>?sslmode=require
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS  # e.g. https://crimespot-web.onrender.com
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: crimespot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx ng build
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
