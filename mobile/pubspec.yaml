name: crimespot
description: CrimeSpot for Android. Report crime, see hotspots, share your location and raise SOS alerts.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_appauth: ">=8.0.0 <10.0.0"
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  web_socket_channel: ^3.0.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  quick_actions: ^1.1.0
  flutter_tts: ^4.2.0
  flutter_ringtone_player: ^4.0.0+4
  vibration: ">=2.0.0 <4.0.0"
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#17202B"
  adaptive_icon_foreground: assets/icon_foreground.png
  min_sdk_android: 23
