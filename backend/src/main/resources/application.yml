server:
  port: ${PORT:8080}
  # Trust Render's proxy headers so the app knows requests are HTTPS (needed for HSTS) and sees real client IPs.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1024
  tomcat:
    max-connections: 8192
    accept-count: 200

spring:
  application:
    name: crimespot-api
  # Java 21 virtual threads: thousands of concurrent requests and sockets without a large thread pool.
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/crimespot}
    username: ${DATABASE_USERNAME:crimespot}
    password: ${DATABASE_PASSWORD:crimespot}
    hikari:
      # Small pool: queries are short, and Neon's free compute allows ~100 connections in total.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1500000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

app:
  crypto:
    # 32-byte AES key, base64. Generate with: openssl rand -base64 32
    # Keep a safe copy: if it's lost, encrypted fields can't be read.
    key: ${DATA_ENCRYPTION_KEY:}
  auth:
    # Keycloak realm URL, exactly as it appears in the token's "iss" claim.
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/crimespot}
    audience: ${KEYCLOAK_AUDIENCE:crimespot-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    # The account that signs in with this (verified) email becomes an admin.
    email: ${ADMIN_EMAIL:}
  push:
    # Generate with: npx web-push generate-vapid-keys
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@example.com}
  hotspots:
    lookback-days: 30
    min-reports: 3
    eps-meters: 250            # DBSCAN neighbourhood radius
    valid-hours: 24
    cron: "0 0 * * * *"         # every hour

management:
  endpoints:
    web:
      exposure:
        include: health
