server:
  port: ${PORT:8080}

spring:
  application:
    name: crimespot-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/crimespot}
    username: ${DATABASE_USERNAME:crimespot}
    password: ${DATABASE_PASSWORD:crimespot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    # Must be at least 32 characters. Override in every real environment.
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-32-plus-chars}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    # Created on first start if no user with this email exists.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  hotspots:
    lookback-days: 30
    min-reports: 3
    cell-size-degrees: 0.005   # about 500 m
    valid-hours: 24
    cron: "0 0 * * * *"         # every hour

management:
  endpoints:
    web:
      exposure:
        include: health
